name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  versioned:
    if: vars.RELEASE_ENABLED == 'true' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Validate approved tag and notes
        run: |
          addon_version="$(tr -d '[:space:]' < VERSION)"
          test "v$addon_version" = "$GITHUB_REF_NAME"
          go run ./cmd/fmt release validate-notes --version "$addon_version"
          sudo apt-get update
          sudo apt-get install -y luajit
          luajit -b ForeverManaTick.lua /dev/null
          luajit tests/runtime.lua
          go test ./...
      - name: Build and inspect release archive
        run: |
          bash tools/package.sh
          unzip -q .release/ForeverManaTick-*.zip -d "$RUNNER_TEMP/addon"
          luajit -b "$RUNNER_TEMP/addon/ForeverManaTick/ForeverManaTick.lua" /dev/null
          unzip -l .release/ForeverManaTick-*.zip
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          addon_version="$(tr -d '[:space:]' < VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            ".release/ForeverManaTick-$addon_version.zip" \
            ".release/ForeverManaTick-$addon_version.zip.manifest.txt" \
            --verify-tag --title "v$addon_version" \
            --notes-file RELEASE_NOTES.md

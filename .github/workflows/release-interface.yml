name: Release reviewed interface update
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-reviewed-interface
  cancel-in-progress: false
jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Plan patch release
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then exit 0; fi
          previous_interface="$(git show "${BEFORE_SHA}:ForeverManaTick.toc" | sed -n 's/^## Interface: //p')"
          current_interface="$(sed -n 's/^## Interface: //p' ForeverManaTick.toc)"
          if [[ "$previous_interface" == "$current_interface" ]]; then exit 0; fi
          previous_version="$(git show "${BEFORE_SHA}:VERSION" | tr -d '[:space:]')"
          current_version="$(tr -d '[:space:]' < VERSION)"
          tag="$(go run ./cmd/fmt release validate \
            --previous-version "$previous_version" --current-version "$current_version" \
            --release-content-changed)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify candidate
        if: steps.plan.outputs.tag != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
          luajit tests/runtime.lua
          go test ./...
          bash tools/package.sh
      - name: Tag and dispatch approved automatic release
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            existing_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            go run ./cmd/fmt release validate-tag --existing-sha "$existing_sha" --target-sha "$GITHUB_SHA"
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh workflow run release.yml --ref "$RELEASE_TAG"
          fi

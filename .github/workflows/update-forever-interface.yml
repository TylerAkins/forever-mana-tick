name: Update Forever interface

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-forever-interface
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch current Forever build
        run: |
          set -euo pipefail
          VERSIONS_URL="$(go run ./cmd/fmt update-interface --print-url)"
          curl --fail --silent --show-error "$VERSIONS_URL" \
            --output "${RUNNER_TEMP}/forever-versions"

      - name: Prepare compatibility release
        id: update
        run: |
          set -euo pipefail
          go run ./cmd/fmt update-interface \
            --versions-file "${RUNNER_TEMP}/forever-versions"
          if git diff --quiet -- ForeverManaTick.toc VERSION CHANGELOG.md RELEASE_NOTES.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GAME_BUILD="$(go run ./cmd/fmt update-interface --versions-file "${RUNNER_TEMP}/forever-versions" --print-game-build)"
          {
            echo "changed=true"
            echo "version=$(tr -d '[:space:]' < VERSION)"
            echo "interface=$(sed -n 's/^## Interface: //p' ForeverManaTick.toc)"
            echo "game_build=${GAME_BUILD}"
          } >> "$GITHUB_OUTPUT"

      - name: Tests
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          go test ./...
          sudo apt-get update
          sudo apt-get install -y luajit
          luajit tests/runtime.lua

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: forever-interface-update
          delete-branch: true
          commit-message: "chore: prepare v${{ steps.update.outputs.version }} for Forever"
          title: "chore: prepare v${{ steps.update.outputs.version }} for Forever ${{ steps.update.outputs.game_build }}"
          assignees: TylerAkins
          body: |
            Automated WoW Forever interface update for @TylerAkins.

            - Game build: `${{ steps.update.outputs.game_build }}`
            - TOC Interface: `${{ steps.update.outputs.interface }}`
            - Addon version: `v${{ steps.update.outputs.version }}`

            Review and test the new client build before merging. If RELEASE_ENABLED is active, merging publishes the patch release and triggers connected CurseForge packaging.
            Select Approve workflows to run in the pull request if GitHub requires approval for the automation-created CI run.
          add-paths: |
            ForeverManaTick.toc
            VERSION
            CHANGELOG.md
            RELEASE_NOTES.md

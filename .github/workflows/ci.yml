name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          luac5.1 -p ForeverManaTick.lua
          lua5.1 tests/runtime.lua
          python3 -m unittest discover -s tests
      - name: Build and inspect
        run: |
          bash tools/package.sh
          unzip -q .release/ForeverManaTick-*.zip -d "$RUNNER_TEMP/addon"
          luac5.1 -p "$RUNNER_TEMP/addon/ForeverManaTick/ForeverManaTick.lua"
          unzip -l .release/ForeverManaTick-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ForeverManaTick-${{ github.sha }}
          path: .release/*
          include-hidden-files: true
          if-no-files-found: error
